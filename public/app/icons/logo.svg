<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" role="img" aria-label="Leisure Exporting LLC">
  <!-- Fondo transparente. Color de marca: terracota #C23B22. Usa currentColor para adaptarse. -->
  <g fill="#C23B22">

    <!-- ===== Icono de barco / exportación ===== -->
    <g>
      <!-- Humo de las chimeneas -->
      <path d="M44 20 q5 -6 0 -12 q-5 -6 0 -10" fill="none" stroke="#C23B22" stroke-width="3" stroke-linecap="round"/>
      <path d="M64 20 q5 -6 0 -12 q-5 -6 0 -10" fill="none" stroke="#C23B22" stroke-width="3" stroke-linecap="round"/>

      <!-- Chimeneas -->
      <rect x="40" y="26" width="9" height="20" rx="1.5"/>
      <rect x="60" y="26" width="9" height="20" rx="1.5"/>

      <!-- Cabina / superestructura -->
      <rect x="34" y="46" width="58" height="20" rx="2"/>

      <!-- Casilleros de carga (containers) -->
      <rect x="36" y="50" width="13" height="12"/>
      <rect x="51" y="50" width="13" height="12"/>
      <rect x="66" y="50" width="13" height="12"/>
      <rect x="81" y="50" width="9"  height="12"/>

      <!-- Casco del barco (curvo) -->
      <path d="M20 70 H106 L96 94 a6 6 0 0 1 -6 4 H36 a6 6 0 0 1 -6 -4 Z"/>

      <!-- Línea de agua -->
      <path d="M8 100 H118" fill="none" stroke="#C23B22" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
    </g>

    <!-- ===== Texto de marca ===== -->
    <g font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="900" text-anchor="start">
      <text x="140" y="46"  font-size="34" letter-spacing="0.5">LEISURE</text>
      <text x="140" y="74"  font-size="22" letter-spacing="1.2">EXPORTING</text>
      <text x="140" y="98"  font-size="17" letter-spacing="2.5">L L C</text>
    </g>
  </g>
</svg>
