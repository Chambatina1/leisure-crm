# Gateway VPN — Leisure Exporting ↔ ETECSA
# Túnel IPsec Site-to-Site según parámetros de ETECSA (formulario recibido)
#
# Parámetros ETECSA:
#   Peer: 200.13.150.40 (Huawei Eudemon 1000E-G12)
#   IKE:  IKEv2, PSK, AES-256, SHA2-256, DH-14 (modp2048), lifetime 28800s
#   IPsec: ESP, AES-256, SHA2-256, PFS DH-14, SA lifetime 36000s / 83886080 KB
#   DPD: periódico 30s (timeout 15 reintentos)
#   Redes remotas: 152.206.64.208/29 · Servicios: 152.206.64.213 TCP 15076 (PROD) / 15077 (TEST)
#   ICMP abierto durante pruebas
#
# Nuestro lado (definido por Leisure):
#   Subred privada de integración: 10.10.0.0/24 (interfaz dummy en el gateway)
#   IP pública: LA QUE ASIGNE EL PROVEEDOR (completar en el formulario ETECSA)

conn leisure-etecsa
    # ── Nuestro extremo ──
    left=%defaultroute
    leftid=%%LEISURE_PUBLIC_IP%%
    leftsubnet=10.10.0.0/24

    # ── Extremo ETECSA ──
    right=200.13.150.40
    rightid=200.13.150.40
    rightsubnet=152.206.64.208/29

    # ── Autenticación ──
    authby=psk
    keyexchange=ikev2

    # ── Propuestas (exactas a las de ETECSA) ──
    ike=aes256-sha2_256-modp2048!
    esp=aes256-sha2_256-modp2048!

    # ── Tiempos de vida ──
    ikelifetime=28800s
    lifetime=36000s
    lifebytes=83886080

    # ── DPD / reconexión automática ──
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=150s

    # ── Comportamiento ──
    auto=start
    keyingtries=%forever
    fragmentation=yes
    mobike=no
    reauth=yes
    closeaction=restart
